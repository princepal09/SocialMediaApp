name: pixora-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "
          try { rs.status() }
          catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'mongo:27017' }]
            })
          };
          quit(db.hello().isWritablePrimary ? 0 : 1)
          "
      interval: 10s
      timeout: 15s
      start_period: 30s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    networks:
      - database
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: princepal09/pixora-backend:v1
    restart: unless-stopped
    init: true
    env_file:
      - ./server/.env.production
    networks:
      - application
      - database
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http = require('node:http');
          const req = http.get(
            'http://127.0.0.1:6000/healthz',
            (res) => {
              res.resume();
              process.exit(res.statusCode === 200 ? 0 : 1);
            }
          );
          req.on('error', () => process.exit(1));
          req.setTimeout(4000, () => {
            req.destroy();
            process.exit(1);
          });
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    image: princepal09/pixora-frontend:v1
    restart: unless-stopped
    networks:
      - application

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - application
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

networks:
  application:
  database:
    internal: true

volumes:
  mongo_prod_data:
  redis_prod_data: